name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          {
          echo "== FRED"; curl -s -m 40 -w "\nHTTP %{http_code}\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=PCEPILFE&cosd=2026-05-01" | tail -6
          echo "== TWSE holiday"; curl -s -m 30 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule" | head -c 400
          echo; echo "== TAIFEX finalSettlePrice"; curl -s -m 30 -L -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://www.taifex.com.tw/cht/5/finalSettlePrice" | head -c 300
          echo; echo "== TAIFEX openapi"; curl -s -m 30 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://openapi.taifex.com.tw/v1/DailyMarketReportFut" | head -c 300
          echo; echo "== TAIFEX swagger"; curl -s -m 30 -w "\nHTTP %{http_code}\n" -A "Mozilla/5.0" "https://openapi.taifex.com.tw/v1/swagger/v1/swagger.json" | head -c 300
          } > probe_out.txt 2>&1
          git config user.name x; git config user.email x@users.noreply.github.com
          git add probe_out.txt && git commit -q -m probe && git pull --rebase -q origin main && git push -q origin main
