name: ETF Holdings Watch

on:
  workflow_dispatch: {}
  schedule:
    # UTC。台灣時間 = UTC+8。每天 19:00（投信約 16:30 前後更新完）；週末資料不變，程式會自動略過
    - cron: '0 11 * * *'

concurrency:
  group: etf-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ETF watch
        env:
          DISCORD_WEBHOOK_ETF: ${{ secrets.DISCORD_WEBHOOK_ETF }}
        run: python etf_watch.py

      - name: Commit updated state
        run: |
          git config user.name "tw-stock-alerts"
          git config user.email "actions@users.noreply.github.com"
          git add etf_state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "etf state update"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin main && break
              sleep 3
            done
          fi
