name: ETF Holdings Watch

on:
  workflow_dispatch: {}
  schedule:
    # UTC。台灣時間 = UTC+8。投信約 16:30 前後更新完。GitHub 排程常延遲數小時(整點尤其嚴重)，
    # 所以避開整點、多排幾班；程式靠 etf_state.json 逐檔去重，不會重複發；週末資料不變會自動略過
    # 台灣 17:13 / 18:13 / 19:13 / 20:13 / 21:13
    - cron: '13 9 * * *'
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'
    - cron: '13 12 * * *'
    - cron: '13 13 * * *'

concurrency:
  group: etf-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ETF watch
        env:
          DISCORD_WEBHOOK_ETF: ${{ secrets.DISCORD_WEBHOOK_ETF }}
          DISCORD_WEBHOOK_ETF_DIV: ${{ secrets.DISCORD_WEBHOOK_ETF_DIV }}
        run: python etf_watch.py

      - name: Commit updated state
        run: |
          git config user.name "tw-stock-alerts"
          git config user.email "actions@users.noreply.github.com"
          git add etf_state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "etf state update"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin main && break
              sleep 3
            done
          fi
