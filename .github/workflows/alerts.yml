name: TW Stock Alerts

on:
  workflow_dispatch:
    inputs:
      force_hannstar:
        description: 'set to 1 to run the HannStar (6116) site check regardless of time'
        required: false
        default: '0'
  schedule:
    # UTC。台灣時間 = UTC+8。08:00~13:00 每小時一次；16:00~22:00 每 30 分鐘一次
    - cron: '0 0-5 * * *'
    - cron: '0,30 8-13 * * *'
    - cron: '0 14 * * *'

concurrency:
  group: tw-stock-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_2330: ${{ secrets.DISCORD_WEBHOOK_2330 }}
          DISCORD_WEBHOOK_PASSIVE: ${{ secrets.DISCORD_WEBHOOK_PASSIVE }}
          DISCORD_WEBHOOK_EQUIP: ${{ secrets.DISCORD_WEBHOOK_EQUIP }}
          DISCORD_WEBHOOK_FOUNDRY: ${{ secrets.DISCORD_WEBHOOK_FOUNDRY }}
          DISCORD_WEBHOOK_PANEL: ${{ secrets.DISCORD_WEBHOOK_PANEL }}
          DISCORD_WEBHOOK_FINANCE: ${{ secrets.DISCORD_WEBHOOK_FINANCE }}
          DISCORD_WEBHOOK_SHIPPING: ${{ secrets.DISCORD_WEBHOOK_SHIPPING }}
          DISCORD_WEBHOOK_TRANSPORT: ${{ secrets.DISCORD_WEBHOOK_TRANSPORT }}
          DISCORD_WEBHOOK_PCBRAND: ${{ secrets.DISCORD_WEBHOOK_PCBRAND }}
          DISCORD_WEBHOOK_AINET: ${{ secrets.DISCORD_WEBHOOK_AINET }}
          DISCORD_WEBHOOK_ASIC: ${{ secrets.DISCORD_WEBHOOK_ASIC }}
        run: python tw_alerts.py

      # 彩晶官網法說會頁：每天台灣時間 09/13/17/21 點的第一次執行才檢查（官網擋一般請求，需無頭瀏覽器）
      - name: Gate HannStar check
        id: gate
        run: |
          H=$(TZ=Asia/Taipei date +%-H); M=$(TZ=Asia/Taipei date +%-M)
          if [ "${{ github.event.inputs.force_hannstar }}" = "1" ] || { [ "$M" -lt 30 ] && [ "$H" -ge 9 ] && [ $((H % 4)) -eq 1 ]; }; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: HannStar (6116) conference page check
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_PANEL: ${{ secrets.DISCORD_WEBHOOK_PANEL }}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          python hannstar_watch.py

      - name: Commit updated state
        run: |
          git config user.name "tw-stock-alerts"
          git config user.email "actions@users.noreply.github.com"
          git add state.json hannstar_state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state update"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin main && break
              sleep 3
            done
          fi

      # 盤後報告 / 主動ETF持股：GitHub 自己的 schedule 常晚數小時，改由這支(cron-job.org 準時每30分觸發)順帶叫起來。
      # 兩支程式都靠 state 檔去重，重複叫沒關係。ETF 台灣 17~23 點、盤後報告 19~23 點
      - name: Kick ETF / market report workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Taipei date +%-H)
          if [ "$H" -ge 17 ] && [ "$H" -le 23 ]; then gh workflow run etf.yml --ref main; fi
          if [ "$H" -ge 19 ] && [ "$H" -le 23 ]; then gh workflow run market.yml --ref main; fi
          # 美國總經(CPI/PPI/非農/PCE/FOMC)與台指期結算日：台灣 16~23、1~3、8 點
          case " 1 2 3 8 16 17 18 19 20 21 22 23 " in *" $H "*) gh workflow run macro.yml --ref main;; esac
