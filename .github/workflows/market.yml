name: Market Report

on:
  workflow_dispatch: {}
  schedule:
    # UTC。台灣時間 = UTC+8。GitHub 排程常延遲數小時(整點尤其嚴重)，所以避開整點、多排幾班；
    # 程式靠 market_state.json 去重，只會發一次；休市日資料日期沒變會自動略過
    # 台灣 19:23 / 20:23 / 21:07 / 21:37 / 22:07 / 22:37 / 23:07 (遇到融資資料還沒更新會等下一班，23:00 後不管如何都發)
    - cron: '23 11 * * *'
    - cron: '23 12 * * *'
    - cron: '7 13 * * *'
    - cron: '37 13 * * *'
    - cron: '7 14 * * *'
    - cron: '37 14 * * *'
    - cron: '7 15 * * *'

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run market report
        env:
          DISCORD_WEBHOOK_MARKET: ${{ secrets.DISCORD_WEBHOOK_MARKET }}
        run: python market_report.py

      - name: Commit updated state
        run: |
          git config user.name "tw-stock-alerts"
          git config user.email "actions@users.noreply.github.com"
          git add market_state.json
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "market state update"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin main && break
              sleep 3
            done
          fi
